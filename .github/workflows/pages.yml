# Publishes Unify Lens to GitHub Pages.
#
# The SDK comes from GitHub Packages in the bizzdesign org, which the automatic
# GITHUB_TOKEN cannot read, so this needs a repository secret PACKAGES_TOKEN —
# a PAT with read:packages that can see that org. Without it `npm ci` fails
# before anything is built.
#
# Pages must be set to build from GitHub Actions (Settings > Pages > Source).
# Serving from a branch instead leaves deploy-pages with nothing to publish to,
# and puts the site back on hand-built uploads — which is how the site came to be
# serving a 4 MB sourcemap beside a 1.6 MB bundle.
#
# The build runs with no .env and no config.json, so the artifact is
# tenant-neutral: on first run it asks which Unify environment to use and reads
# that environment's env.js. Baking a tenant in would mean one build per
# customer.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A deploy that is halfway through publishing should finish. Cancelling it
  # leaves the Pages deployment in flight with nothing to complete it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@bizzdesign'
      # Without this the missing secret surfaces as a bare npm E401, which reads
      # like a broken package rather than an unset repository setting.
      - name: Require the packages token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::PACKAGES_TOKEN is empty or unset. Add a repository secret holding a PAT with read:packages that can see the bizzdesign org (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      # DEPLOY=1 drops sourcemaps, which would otherwise publish the app source.
      - run: DEPLOY=1 npm run build
      # A sourcemap here means DEPLOY=1 stopped working, and the failure is
      # silent: the deploy succeeds, carrying a map larger than the app.
      - name: Refuse to publish sourcemaps
        run: |
          if find dist -name '*.map' -print -quit | grep -q .; then
            echo "::error::dist contains sourcemaps; DEPLOY=1 did not take effect."
            exit 1
          fi
      # Pages serves no index.html for unknown paths; the app is a single page,
      # so the 404 has to be the app itself or a deep link dead-ends.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
