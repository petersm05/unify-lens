# Publishes Unify Lens to GitHub Pages.
#
# Manual trigger only. The SDK comes from GitHub Packages in the bizzdesign org,
# which the automatic GITHUB_TOKEN cannot read, so this needs a repository
# secret PACKAGES_TOKEN — a PAT with read:packages that can see that org.
# Without it `npm ci` fails, which is why this does not run on every push.
#
# The build runs with no .env and no config.json, so the artifact is
# tenant-neutral: on first run it asks which Unify environment to use and reads
# that environment's env.js. Baking a tenant in would mean one build per
# customer.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@bizzdesign'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      # DEPLOY=1 drops sourcemaps, which would otherwise publish the app source.
      - run: DEPLOY=1 npm run build
      # Pages serves no index.html for unknown paths; the app is a single page,
      # so the 404 has to be the app itself or a deep link dead-ends.
      - run: cp dist/index.html dist/404.html
      # A custom domain, when one is configured. Pages takes the domain from
      # the repository's own settings, so this file is not what switches it on
      # — but an artifact that carries its own hostname keeps serving correctly
      # if it is ever published somewhere else, and survives the setting being
      # cleared by a later change to the Pages source. Set the CUSTOM_DOMAIN
      # repository variable to the bare hostname: no scheme, no trailing slash.
      - if: vars.CUSTOM_DOMAIN != ''
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: printf '%s\n' "$CUSTOM_DOMAIN" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
